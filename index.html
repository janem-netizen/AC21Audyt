<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Операційний самоаудит для виробничих компаній України від AC21 Industrial Systems: 12 блоків, індекс зрілості, карта розривів і AI-рішення.">
<meta name="theme-color" content="#141414">
<title>Операційний самоаудит AC21</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: маршрутна карта — ліворуч операції 010…120 як маршрут замовлення через цех, праворуч робоче місце з поточним блоком */
:root{
  --bg:#141414; --panel:#1B1A19; --panel-2:#23211F; --line:#33302C; --fg:#EEEAE5; --muted:#9C958D;
  --accent:#E8620A; --accent-ink:#141414; --accent-soft:rgba(232,98,10,.16);
  --crit:#E5574A; --warn:#E3A33B; --mid:#6FA3C7; --ok:#5DB07A;
  --f-display:"Geologica","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --gut:clamp(16px,3vw,32px);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F3F3F1; --panel:#FFFFFF; --panel-2:#ECEBE8; --line:#D9D6D1; --fg:#171615; --muted:#655F58;
  --accent:#D2560A; --accent-ink:#141414; --accent-soft:rgba(210,86,10,.11);
  --crit:#C23A2E; --warn:#A87310; --mid:#2C6A94; --ok:#2C7E4C; color-scheme:light;}}
:root[data-theme="light"]{
  --bg:#F3F3F1; --panel:#FFFFFF; --panel-2:#ECEBE8; --line:#D9D6D1; --fg:#171615; --muted:#655F58;
  --accent:#D2560A; --accent-ink:#141414; --accent-soft:rgba(210,86,10,.11);
  --crit:#C23A2E; --warn:#A87310; --mid:#2C6A94; --ok:#2C7E4C; color-scheme:light;}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body);margin:0;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:18px;max-width:1240px;margin:0 auto;padding-inline:var(--gut);padding-block:12px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;flex:none}
.mark{font:700 14px/1 var(--f-display);letter-spacing:.03em;background:var(--accent);color:var(--accent-ink);padding:7px 8px;border-radius:2px}
.brand b{display:block;font:600 14px/1.2 var(--f-display)}
.brand span{display:block;font:500 11px/1.3 var(--f-mono);color:var(--muted);letter-spacing:.07em;text-transform:uppercase}
.prog{flex:1;display:flex;align-items:center;gap:12px;min-width:0}
.prog-bar{flex:1;height:3px;background:var(--line);overflow:hidden}
.prog-bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .35s ease}
.prog-num{font:500 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 14px/1 var(--f-body);padding:12px 18px;border-radius:2px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.sm{padding:9px 13px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* shell */
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);gap:clamp(24px,4vw,64px);max-width:1240px;margin:0 auto;padding-inline:var(--gut);padding-block:32px 96px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);align-self:start;max-height:calc(100vh - 110px);overflow:auto}
.rail-h{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px 10px}
.rail ol{list-style:none;margin:0;padding:0;display:grid;gap:1px;position:relative}
.ri{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:8px;width:100%;padding:8px 10px;border:0;border-radius:2px;background:none;text-align:left;cursor:pointer}
.ri:hover{background:var(--panel)}
.ri .code{font:500 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.ri .nm{font-size:14px;line-height:1.3}
.ri .ct{font:500 11px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.ri.done .ct{color:var(--ok)}
.ri[aria-current="step"]{background:var(--panel-2)}
.ri[aria-current="step"] .code{color:var(--accent)}
.ri.res{margin-top:10px;border-top:1px solid var(--line);border-radius:0;padding-top:14px}
.rail-note{font-size:12px;color:var(--muted);margin:18px 10px 0;line-height:1.5}

main{min-width:0}
.eyebrow{font:500 12px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin:0}
h1{font:700 clamp(32px,4.8vw,56px)/1.04 var(--f-display);letter-spacing:-.025em;margin:14px 0 18px;text-wrap:balance;max-width:16ch}
h2{font:600 clamp(24px,2.8vw,32px)/1.12 var(--f-display);letter-spacing:-.015em;margin:10px 0 12px;text-wrap:balance}
h3{font:600 18px/1.25 var(--f-display);margin:0 0 10px}
.lead{font-size:17px;line-height:1.6;color:var(--muted);max-width:62ch;margin:0}
p{margin:0}

/* intro */
.facts{display:flex;flex-wrap:wrap;gap:0;margin:28px 0 36px;border-block:1px solid var(--line)}
.fact{padding:16px 22px 16px 0;margin-right:22px;display:grid;gap:2px}
.fact b{font:600 24px/1 var(--f-display);font-variant-numeric:tabular-nums}
.fact span{font-size:13px;color:var(--muted)}
.intro-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:22px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fld{display:grid;gap:6px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font:500 12px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:10px 12px;font-size:15px}
.fld textarea{min-height:76px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.legend{display:grid;gap:0}
.lg{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.lg:first-of-type{border-top:0}
.lg b{font:600 15px var(--f-mono);color:var(--accent)}
.lg strong{display:block;font-weight:600;font-size:14px}
.lg span{font-size:13px;color:var(--muted)}
.privacy{font-size:13px;color:var(--muted);margin-top:16px;max-width:60ch}
.gets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:36px}
.gets div{background:var(--bg);padding:16px 18px}
.gets b{display:block;font:600 14px var(--f-display);margin-bottom:4px}
.gets span{font-size:13px;color:var(--muted)}

/* block */
.blk-h{display:grid;gap:4px;margin-bottom:8px}
.dirs{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.dir{font:500 12px var(--f-mono);border:1px solid var(--line);padding:4px 8px;border-radius:2px;color:var(--muted)}
.dir em{font-style:normal;color:var(--accent)}
.bprog{font:500 12px var(--f-mono);color:var(--muted);margin:22px 0 4px;font-variant-numeric:tabular-nums}
.q{padding:24px 0;border-top:1px solid var(--line);display:grid;gap:14px}
.q-head{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px}
.q-num{font:500 13px var(--f-mono);color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.q-t{font-size:16.5px;font-weight:500;line-height:1.45;max-width:64ch}
.hint{margin-top:6px}
.hint summary{cursor:pointer;color:var(--muted);font-size:13px;list-style:none;display:inline-flex;gap:6px}
.hint summary::-webkit-details-marker{display:none}
.hint summary::before{content:"+";font-family:var(--f-mono);color:var(--accent)}
.hint[open] summary::before{content:"−"}
.hint p{font-size:14px;color:var(--muted);margin-top:6px;max-width:62ch;border-left:2px solid var(--accent);padding-left:10px}
.answer{margin-left:60px;display:grid;gap:8px}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px}
.opt{position:relative;min-width:0}
.opt input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.cell{display:flex;flex-direction:column;gap:3px;padding:9px 10px 8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;min-height:56px;transition:background .15s,border-color .15s}
.opt:first-child .cell{border-radius:2px 0 0 2px}.opt:last-child .cell{border-radius:0 2px 2px 0}
.cell:hover{border-color:var(--muted)}
.cell .v{font:600 15px/1 var(--f-mono)}
.cell .l{font-size:12px;line-height:1.2;color:var(--muted);overflow-wrap:anywhere}
.cell.on{background:var(--accent-soft);border-color:var(--accent)}
.opt input:checked + .cell{background:var(--accent);border-color:var(--accent)}
.opt input:checked + .cell .v,.opt input:checked + .cell .l{color:var(--accent-ink)}
.opt input:focus-visible + .cell,.chip input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.extra{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip span{display:inline-block;font-size:13px;padding:5px 11px;border:1px dashed var(--line);border-radius:999px;color:var(--muted);cursor:pointer}
.chip input:checked + span{border-style:solid;border-color:var(--fg);color:var(--fg);background:var(--panel-2)}
.bnav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px;padding-top:24px;border-top:1px solid var(--line)}
.demo-flag{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between;background:var(--accent-soft);border:1px solid var(--accent);padding:10px 14px;border-radius:2px;margin-bottom:24px;font-size:14px}

/* results */
.res-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:16px;margin-bottom:24px}
.kpis{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:28px}
.kpi{background:var(--panel);padding:20px 22px;display:grid;gap:6px;align-content:start}
.kpi .lab{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .num{font:700 48px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .num small{font-size:20px;color:var(--muted);font-weight:600}
.kpi .sub{font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--f-mono);letter-spacing:.03em;padding:4px 9px;border-radius:999px;border:1px solid currentColor;width:max-content}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.c-crit{color:var(--crit)}.c-warn{color:var(--warn)}.c-mid{color:var(--mid)}.c-ok{color:var(--ok)}.c-na{color:var(--muted)}
.map{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center;margin-bottom:40px}
.radar{width:100%;max-width:440px;height:auto;display:block;margin:0 auto}
.radar text{font-family:var(--f-mono);font-size:10.5px;fill:var(--muted)}
.bars{display:grid;gap:0}
.bar{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(70px,1.1fr) 44px;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.bar:hover .bn{color:var(--accent)}
.bar .bc{font:500 12px var(--f-mono);color:var(--muted)}
.bar .bn{font-size:14px;min-width:0}
.bar .bt{height:8px;background:var(--panel-2);position:relative}
.bar .bt i{position:absolute;inset:0 auto 0 0;background:currentColor}
.bar .bv{font:600 13px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.sec{margin-top:44px}
.sec > p.lead{margin-bottom:18px}
.gaps{display:grid;gap:0;counter-reset:g}
.gap{display:grid;grid-template-columns:42px minmax(0,1fr);gap:12px;padding:18px 0;border-top:1px solid var(--line)}
.gap .gn{font:600 22px/1 var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums}
.gap .gm{display:flex;flex-wrap:wrap;gap:6px 12px;font:500 12px var(--f-mono);color:var(--muted);margin-bottom:6px}
.gap .gt{font-weight:500;font-size:15.5px;margin-bottom:8px}
.gap .ga{font-size:14px;color:var(--fg);background:var(--panel);border-left:2px solid var(--accent);padding:9px 12px}
.gap .ga b{font:600 11px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:3px}
.prio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.prio .panel{display:grid;gap:8px;align-content:start}
.prio .rk{font:500 12px var(--f-mono);color:var(--muted)}
.det{border-top:1px solid var(--line)}
.det summary{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:14px 0;cursor:pointer;list-style:none}
.det summary::-webkit-details-marker{display:none}
.det summary .bc{font:500 12px var(--f-mono);color:var(--muted)}
.det summary .bn{font-weight:600}
.det-body{padding:0 0 18px 44px;display:grid;gap:10px}
.drow{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:12px;font-size:14px;padding:8px 0;border-top:1px dashed var(--line)}
.drow .ans{font:500 12px var(--f-mono);text-align:right}
.drow .rec{grid-column:1/-1;color:var(--muted);font-size:13px}
.drow .rec b{color:var(--accent);font-weight:600}
.export{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center}
.export .btns{display:flex;flex-wrap:wrap;gap:8px}
.ex-note{font-size:13px;color:var(--muted);margin-top:8px}
.cta{margin-top:44px;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--accent);padding:26px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px}
.contacts{display:grid;gap:10px;font:500 14px var(--f-mono)}
.contacts span{display:block;font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.contacts a{color:var(--fg);text-decoration:none;border-bottom:1px solid var(--line);user-select:all}
.contacts a:hover{border-color:var(--accent)}
.empty{padding:40px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:2px;font-size:14px;z-index:50;max-width:calc(100% - 32px)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:960px){
  .shell{grid-template-columns:minmax(0,1fr);padding-top:0}
  .rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:20;max-height:none;overflow-x:auto;background:var(--bg);margin-inline:calc(-1 * var(--gut));padding-inline:var(--gut);padding-block:10px;border-bottom:1px solid var(--line);scrollbar-width:none}
  .rail-h,.rail-note{display:none}
  .rail ol{display:flex;gap:6px;width:max-content}
  .ri{grid-template-columns:auto auto;padding:7px 11px;border:1px solid var(--line);white-space:nowrap}
  .ri .ct{display:none}
  .ri.res{margin-top:0;padding-top:7px;border-top:1px solid var(--line);border-radius:2px}
  main{padding-top:26px}
  .intro-grid,.map,.cta,.export{grid-template-columns:minmax(0,1fr)}
  .prio{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .brand span{display:none}
  .prog-bar{display:none}
  .prog{justify-content:flex-end}
  .answer{margin-left:0}
  .q-head{grid-template-columns:44px minmax(0,1fr)}
  .cell{padding:8px 6px;min-height:52px}
  .cell .l{font-size:11px}
  .form{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:minmax(0,1fr)}
  .gets{grid-template-columns:minmax(0,1fr)}
  .bar{grid-template-columns:30px minmax(0,1fr) 60px 40px}
  .det-body{padding-left:0}
  .drow{grid-template-columns:minmax(0,1fr) 92px}
  .top .btn{padding:9px 11px;font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="logo" href="https://www.ac21industrial.com/" target="_blank" rel="noopener">
      <span class="mark">AC21</span>
      <span class="brand"><b>AC21 Industrial Systems</b><span>Операційний самоаудит</span></span>
    </a>
    <div class="prog" aria-label="Прогрес заповнення">
      <div class="prog-bar"><i id="progFill"></i></div>
      <span class="prog-num" id="progNum">0 / 0</span>
    </div>
    <button class="btn pri sm" data-act="results" type="button">Результати</button>
  </div>
</header>

<div class="shell">
  <nav class="rail" aria-label="Блоки самоаудиту">
    <p class="rail-h">Маршрутна карта</p>
    <ol id="rail"></ol>
    <p class="rail-note">Відповіді зберігаються лише у вашому браузері. Можна перерватися й повернутися пізніше.</p>
  </nav>
  <main id="main" tabindex="-1"></main>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(function(){
"use strict";

/* ---------- Content ---------- */
const DIRS = {
  "01":"Технічна документація R&D","02":"Операційна координація","03":"Інженерні правила",
  "04":"Польові дані для R&D","05":"Інтелектуальна власність","06":"Ринкова та конкурентна аналітика","07":"Автоматизація продажів"
};
const LV = [
  {v:0,s:"Немає",t:"Відсутнє",d:"Процесу чи практики немає."},
  {v:1,s:"Стихійно",t:"Стихійно",d:"Тримається на окремих людях, у головах і чатах."},
  {v:2,s:"Частково",t:"Частково",d:"Є домовленості й таблиці, але вручну і не завжди."},
  {v:3,s:"Системно",t:"Системно",d:"Регламент працює, дані ведуться в системі чи Excel."},
  {v:4,s:"Цифрово",t:"Цифрово",d:"Система з даними в реальному часі та метриками."}
];
const B = [
 {id:"mgmt",code:"010",name:"Управління та планування",short:"Управління",dir:["02"],
  desc:"Як цілі власника перетворюються на план, а план — на щоденні рішення в цеху.",qs:[
  {id:"m1",t:"Річні цілі компанії розкладені на квартальні KPI для кожного відділу, і керівники відділів знають свої цифри.",h:"5–7 показників на відділ, у кожного є власник, факт переглядається щомісяця.",ai:"Дерево KPI і щомісячний звіт, який збирається автоматично з облікових систем, а не вручну перед нарадою."},
  {id:"m2",d:1,t:"Власник і директор бачать стан замовлень, виробництва, закупівель і грошей в одній картині, без ручного зведення з чатів і Excel.",h:"Один екран зі статусом на сьогодні; зведення не забирає нікому годин щотижня.",ai:"Операційний дашборд: AI-агент щодня зводить дані з обліку, CRM і чатів у статус-картину з вузькими місцями."},
  {id:"m3",t:"Зрозуміло, хто яке рішення ухвалює, і рішення фіксуються разом з обґрунтуванням.",h:"Є матриця повноважень; через пів року можна знайти, хто, коли і чому погодив зміну.",ai:"Журнал рішень: асистент фіксує рішення з нарад і листування, відповідальних і строки."},
  {id:"m4",t:"Наради мають порядок денний, протокол і контроль виконання доручень.",h:"Доручення з наради того ж дня з’являються в таск-системі з відповідальним і строком.",ai:"Протоколи нарад із запису: доручення автоматично потрапляють у трекер і нагадуються."},
  {id:"m5",t:"Наскрізний процес від заявки клієнта до відвантаження описаний, і на практиці його дотримуються.",h:"Схема процесу актуальна, кожна передача між відділами має власника і стандарт.",ai:"Аналіз фактичного процесу за даними систем: де він розходиться з регламентом і де губляться передачі."},
  {id:"m6",t:"Є план безперервності роботи на випадок блекаутів, обстрілів, втрати ключових людей чи постачальника.",h:"Сценарії розписані, відповідальні призначені, план перевірявся на практиці за останній рік.",ai:"Сценарне моделювання: як змінюються план і строки при втраті лінії, людей чи постачальника."}]},
 {id:"rnd",code:"020",name:"R&D та інженерія",short:"R&D",dir:["01","04","05"],
  desc:"Як потреба замовника стає перевіреним кресленням, а креслення — стабільною серією.",qs:[
  {id:"r1",dir:"01",t:"Вимоги до виробу зафіксовані письмово з критеріями приймання, а не передаються усно чи в месенджері.",h:"Кожна вимога перевірювана: відомо, яким тестом і з яким результатом її вважають виконаною.",ai:"Пакет вимог і критеріїв приймання з ТЗ і листування замовника; трасування вимога → рішення → тест."},
  {id:"r2",dir:"01",d:1,t:"Креслення, 3D-моделі та специфікації (BOM) мають версії, і цех завжди працює за актуальною.",h:"Застаріле креслення не може потрапити на дільницю; видно, яка версія пішла в яку партію.",ai:"Контроль конфігурацій: креслення, BOM і техкарти прив’язані до версії виробу, цех отримує сповіщення про зміни."},
  {id:"r3",dir:"01",t:"Зміни в конструкції проходять через формальне повідомлення про зміну з оцінкою впливу на закупівлі, склад і виробництво.",h:"До затвердження зміни відомо, які залишки, замовлення постачальникам і партії вона зачіпає.",ai:"AI-оцінка впливу зміни на партії, закупівлі й залишки ще до її затвердження."},
  {id:"r4",dir:"04",d:1,t:"Відгуки з поля (від замовника, сервісу, з фронту) системно доходять до інженерів і прив’язуються до версії виробу.",h:"Кожен відгук має статус, критичність і версію; повторювані проблеми видно як частоту.",ai:"Приймання відгуків у тому вигляді, як їх надсилають (голосові, фото, чати), і перетворення на дефекти та вимоги."},
  {id:"r5",dir:"01",t:"Результати випробувань зберігаються як доказова база, яку можна показати партнеру, замовнику чи інвестору.",h:"Для кожної ключової характеристики є протокол: умови, метод, результат, версія виробу.",ai:"Живий evidence package: протоколи випробувань збираються автоматично і прив’язуються до вимог."},
  {id:"r6",dir:"05",t:"Створені технічні рішення інвентаризовані: зрозуміло, що є ноу-хау, що варто патентувати і які права мають партнери.",h:"Є реєстр розробок з авторами й датами; права у спільних проєктах розмежовані договором.",ai:"Реєстр інтелектуальної власності і підготовка вихідних матеріалів для патентного повіреного."}]},
 {id:"mkt",code:"030",name:"Маркетинг",short:"Маркетинг",dir:["06"],
  desc:"Чи знає компанія, кому і чому вона продає, і що в цей час робить конкурент.",qs:[
  {id:"k1",t:"Цільові сегменти та портрет ідеального замовника описані, і продажі працюють саме з ними.",h:"Відомо, які 2–3 сегменти дають основну маржу, і на них іде більшість зусиль.",ai:"Сегментація бази клієнтів за маржею й повторністю; портрет ідеального замовника на даних."},
  {id:"k2",t:"Є актуальні профілі конкурентів: продукти, характеристики, ціни, ринки, публічні контракти.",h:"Профілі оновлювалися за останній квартал і використовуються в переговорах.",ai:"Постійний моніторинг конкурентів: сайти, тендери, виставки, новини у щотижневому дайджесті."},
  {id:"k3",t:"Цінність продукту сформульована мовою замовника; є кейси, техописи й презентації для кожного сегмента і мови ринку.",h:"Менеджер за 10 хвилин збирає англійською пакет матеріалів під конкретного замовника.",ai:"Генерація техописів, презентацій і кейсів під сегмент і мову ринку з вашої технічної бази."},
  {id:"k4",d:1,t:"Відомо, з яких каналів приходять замовники і скільки коштує залучення одного.",h:"Кожен лід має джерело; можна порахувати, які виставки чи канали окупаються.",ai:"Наскрізна аналітика «джерело → угода → маржа», щоб бюджет ішов у канали, що окупаються."},
  {id:"k5",t:"Компанія системно відстежує тендери та регуляторні вимоги на цільових ринках (Prozorro, ЄС, NSPA).",h:"Є перелік джерел, відповідальний і щотижневий огляд нових закупівель.",ai:"Агент моніторингу тендерів: відбирає закупівлі під ваш продукт і готує чек-лист вимог."}]},
 {id:"sales",code:"040",name:"Продажі",short:"Продажі",dir:["07"],
  desc:"Від запиту до договору, який компанія реально здатна виконати в строк.",qs:[
  {id:"s1",d:1,t:"Усі запити, угоди й контакти ведуться в CRM, а не в особистих телефонах і поштових скриньках менеджерів.",h:"Якщо менеджер звільняється, вся історія переговорів лишається в компанії.",ai:"Автоматичне перенесення листів, дзвінків і месенджерів у CRM без ручного введення."},
  {id:"s2",t:"Комерційна пропозиція рахується від фактичної собівартості та поточного завантаження виробництва.",h:"Ціна і строк у КП підтверджені даними, а не лише досвідом менеджера.",ai:"Калькулятор КП, що бере собівартість з обліку і перевіряє строк проти реального завантаження цеху."},
  {id:"s3",t:"Перед підписанням технічний запит перевіряють інженерія та виробництво на реалістичність вимог і строків.",h:"Є стандартна процедура погодження з відповідальними і граничним часом відповіді.",ai:"Перевірка ТЗ на виконуваність до відправки КП: компоненти, потужності, строки, ризики."},
  {id:"s4",d:1,t:"Прогноз продажів на квартал ґрунтується на даних воронки, і його точність перевіряється.",h:"Відхилення прогнозу від факту відоме і зменшується з кожним кварталом.",ai:"Прогноз на основі історії воронки й виробничих даних замість оптимізму менеджера."},
  {id:"s5",t:"Після підписання зобов’язання перед замовником (строки, гарантії, штрафи) відстежуються.",h:"Будь-хто в компанії бачить, що і до якої дати пообіцяли кожному клієнту.",ai:"Реєстр зобов’язань: AI виймає з договорів строки та штрафні умови і нагадує заздалегідь."}]},
 {id:"prod",code:"050",name:"Виробничий цикл",short:"Виробництво",dir:["02"],
  desc:"Чи керований шлях замовлення через цех і чи видно вузькі місця до зриву строку.",qs:[
  {id:"p1",t:"Виробничий план формується з портфеля замовлень з урахуванням потужностей, а не за принципом «хто голосніше просить».",h:"План на тиждень затверджений, зміни в ньому фіксуються з причиною.",ai:"AI-планувальник: черговість запуску з урахуванням потужностей, матеріалів і пріоритетів."},
  {id:"p2",d:1,t:"Для кожного виробу є маршрутна та технологічна карта з нормами часу.",h:"Норми часу перевірені фактом за останній рік, а не взяті «з досвіду».",ai:"Оцифрування техкарт і уточнення норм часу за фактичними даними виконання."},
  {id:"p3",d:1,t:"У будь-який момент видно, на якій операції перебуває кожне замовлення.",h:"На питання «де замовлення?» відповідають без дзвінка в цех.",ai:"Облік операцій через QR чи планшет на дільниці: статус кожного замовлення в реальному часі."},
  {id:"p4",d:1,t:"Вимірюється тривалість виробничого циклу і частка замовлень, відвантажених вчасно (OTD).",h:"OTD відомий щомісяця, причини затримок класифіковані.",ai:"Автоматичний розрахунок OTD і циклу з класифікацією причин затримок."},
  {id:"p5",t:"Вузьке місце виробництва відоме, і план будується навколо нього.",h:"Можна назвати дільницю, що обмежує випуск, і її завантаження у відсотках.",ai:"Аналіз черг і завантаження дільниць, щоб бачити вузьке місце до зриву строку."}]},
 {id:"supply",code:"060",name:"Постачання та закупівлі",short:"Постачання",dir:["02"],
  desc:"Чи прийде потрібний компонент вчасно, за прийнятною ціною і від надійного постачальника.",qs:[
  {id:"u1",d:1,t:"Потреба в матеріалах розраховується з BOM і виробничого плану з урахуванням залишків, а не на око.",h:"Замовлення постачальникам формуються з розрахунку; відхилення від нього — виняток.",ai:"MRP-розрахунок із залишками, товарами в дорозі та страховим запасом; чернетки замовлень постачальникам."},
  {id:"u2",t:"Для критичних компонентів є щонайменше два перевірені постачальники.",h:"Перелік критичних позицій складено, ризик єдиного джерела оцінено.",ai:"Пошук і кваліфікація альтернативних постачальників; карта ризиків єдиного джерела."},
  {id:"u3",d:1,t:"Строки поставки відстежуються, і затримку видно до того, як вона зупинить виробництво.",h:"Кожне замовлення постачальнику має статус і сигнал ризику запізнення.",ai:"Агент, що читає листування з постачальниками, оновлює статуси й попереджає про ризик зриву."},
  {id:"u4",d:1,t:"Є історія цін і умов постачання, пропозиції постачальників порівнюються.",h:"Закупівельне рішення можна пояснити порівнянням кількох пропозицій або історією цін.",ai:"Аналіз історії цін і автоматичне порівняння пропозицій постачальників."},
  {id:"u5",t:"Імпорт, митне оформлення та валютні ризики плануються заздалегідь.",h:"Строки розмитнення закладені в план, вплив курсу на собівартість відомий.",ai:"Контроль імпортних документів і сигнали про вплив курсу на собівартість замовлень."}]},
 {id:"stock",code:"070",name:"Склад і логістика",short:"Склад",dir:["02"],

  {id:"w3",d:1,t:"Матеріали й вироби маркуються (штрихкод чи QR, партія, серійний номер) і простежуються.",h:"За серійним номером виробу знаходяться партії компонентів, з яких його зібрано.",ai:"Наскрізна простежуваність від партії компонента до відвантаженого виробу."},
  {id:"w4",d:1,t:"Матеріали видаються в цех під конкретне замовлення.",h:"Перевитрата матеріалу на замовленні видна і має пояснення.",ai:"Списання під замовлення для фактичної собівартості і контролю перевитрат."},
  {id:"w5",t:"Відвантажувальні та експортні документи формуються без ручного перенабору даних.",h:"ТТН, пакувальні листи й інвойси генеруються з однієї облікової картки.",ai:"Автоматичне формування ТТН, пакувальних листів і документів для експорту."}]},
 {id:"equip",code:"080",name:"Устаткування та ТОіР",short:"Устаткування",dir:["02"],

 {id:"quality",code:"090",name:"Якість",short:"Якість",dir:["03"],

function val(a){ if (a === "na" || a === undefined) return null; if (a === "dk") return 0; return a; }

function radarSVG(scores, c){
  const W = 460, cx = W/2, cy = W/2, R = 150, n = scores.length;
  const pt = (i,r) => { const a = -Math.PI/2 + i*2*Math.PI/n; return [cx + r*Math.cos(a), cy + r*Math.sin(a)]; };
  let s = `<svg class="radar" viewBox="0 0 ${W} ${W}" role="img" aria-label="Радар зрілості за блоками" xmlns="http://www.w3.org/2000/svg">`;
  [25,50,75,100].forEach(r => { s += `<polygon points="${scores.map((_,i)=>pt(i,R*r/100).join(",")).join(" ")}" fill="none" stroke="${c.grid}" stroke-width="1"/>`; });
  scores.forEach((_,i) => { const [x,y] = pt(i,R); s += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${c.grid}" stroke-width="1"/>`; });
  [50,100].forEach(r => { s += `<text x="${cx+4}" y="${cy-R*r/100+12}" fill="${c.muted}" font-size="9.5">${r}</text>`; });
  const poly = scores.map((o,i) => pt(i, R*(o.v||0)/100).join(",")).join(" ");
  s += `<polygon points="${poly}" fill="${c.fill}" stroke="${c.line}" stroke-width="2" stroke-linejoin="round"/>`;
  scores.forEach((o,i) => { const [x,y] = pt(i, R*(o.v||0)/100); s += `<circle cx="${x}" cy="${y}" r="3.5" fill="${o.v===null?c.muted:c.line}"/>`; });
  scores.forEach((o,i) => {

function saveFile(filename, data){

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast("Файл збережено");

<table><thead><tr><th>Код</th><th>Твердження</th><th>Відповідь</th></tr></thead><tbody>${B.map(b => `<tr><td colspan="3" style="background:#F3F3F1;font-weight:600">${b.code} · ${esc(b.name)} — ${blockScore(b)===null?"—":blockScore(b)+" / 100"}</td></tr>` + b.qs.map((q,k) => { const a = S.answers[q.id], v = val(a); return `<tr><td class="mu" style="font-family:'IBM Plex Mono',monospace;white-space:nowrap">${b.code}.${k+1}</td><td>${esc(q.t)}${v!==null&&v<=2?`<div class="mu" style="font-size:12px;margin-top:3px">→ ${esc(q.ai)}</div>`:""}</td><td style="white-space:nowrap;color:${v===null?col.na:v<=1?col.crit:v===2?col.warn:col.ok};font-weight:600">${esc(ansLabel(a))}</td></tr>`; }).join("")).join("")}</tbody></table>

function summaryText(){
  const p = S.profile, ov = overall(), dr = dataReady();
  let t = `Операційний самоаудит AC21 — ${p.company||"компанія"}\n${new Date().toLocaleDateString("uk-UA")}\n\nІндекс операційної зрілості: ${ov}/100 (${level(ov).t})\nГотовність даних до AI: ${dr===null?"—":dr}/100 (${level(dr).t})\nЗаповнено: ${answered()} з ${TOTAL}\n\nБлоки:\n`;
  B.forEach(b => { const v = blockScore(b); t += `${b.code} ${b.name}: ${v===null?"—":v}\n`; });
  t += `\nТоп розривів:\n`; gaps().slice(0,8).forEach((x,i) => { t += `${i+1}. [${x.b.short}] ${x.q.t} — ${ansLabel(x.a)}\n   Рішення: ${x.q.ai}\n`; });
  return t + `\nAC21 Industrial Systems · www.ac21industrial.com · WhatsApp +380 67 779 95 36`;
}
function copySummary(){
  if (!answered()) { toast("Спершу дайте хоча б одну відповідь"); return; }
  const txt = summaryText();
  const fallback = () => { const ta = document.createElement("textarea"); ta.value = txt; ta.setAttribute("readonly",""); ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch(e) {} ta.remove(); toast(ok ? "Підсумок скопійовано" : "Не вдалося скопіювати автоматично"); };
  try { navigator.clipboard.writeText(txt).then(() => toast("Підсумок скопійовано"), fallback); } catch(e) { fallback(); }
}

render(false);
})();
